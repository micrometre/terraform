#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

# Network configuration with DHCP first
network:
  version: 2
  ethernets:
    ens3:
      dhcp4: true

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    home: /home/ubuntu
    shell: /bin/bash
    lock_passwd: false
    ssh-authorized-keys:
      - ${ssh_public_key}
# Install packages
packages:
  - qemu-guest-agent
  - curl
  - wget
  - vim
  - git
  - openssh-server
# Enable services
runcmd:
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
  - systemctl enable ssh
  - systemctl start ssh
  # Enable console login
  - systemctl enable serial-getty@ttyS0.service
  - systemctl start serial-getty@ttyS0.service
  # Configure kernel console
  - sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT="console=tty0 console=ttyS0,115200n8"/' /etc/default/grub
  - update-grub
# Set timezone UK London
timezone: Europe/London

# Update packages
package_update: true
package_upgrade: true